<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>4b - Display</title>
    <style>
        body {
            margin: 0;
            background-color: #1c1c1c;
            padding: 2rem;
        }

        .linha {
            display: flex;
        }

        .caixa {
            width: 100px;
            height: 60px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 1.5rem;
        }

        .roxo   { background-color: #6a1bbf; }
        .verde  { background-color: #2e7d32; }
        .vermelho { background-color: #d32f2f; }
        .amarelo { background-color: #fdd835; color: black; }
    </style>
</head>
<body>
    <div class="linha">
        <div class="caixa roxo">1</div>
        <div class="caixa verde">2</div>
        <div class="caixa vermelho">3</div>
        <div class="caixa amarelo">4</div>
    </div>

    <p style="font-family: Arial, sans-serif; margin-top: 1rem; color: white;">
        Explicação: o container ".linha" usa display: flex, então os filhos deixam de se
        comportar como block e passam a ficar lado a lado, na horizontal, em uma única linha.
    </p>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Questao1</title>

<style>
body {
    margin: 0;
    background: #eee;
}

/* Container ocupa a tela toda */
.card {
    width: 100vw;
    height: 100vh;
    background: #ddd;
    border: 4px solid purple;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
}

/* Logo */
.logo {
    font-size: 20px;
    color: #777;
    margin-bottom: 30px;
}

/* Linhas */
.linha {
    width: 60%;
    height: 15px;
    background: #ccc;
    border-radius: 8px;
    margin: 10px 0;
}

/* Espaço flexível */
.espaco {
    flex: 1;
}

/* Avatar */
.avatar {
    width: 100px;
    height: 100px;
    background: #bbb;
    border-radius: 50%;
    margin-bottom: 20px;
}

/* Linha final */
.linha-pequena {
    width: 30%;
    height: 15px;
    background: #ccc;
    border-radius: 8px;
}
</style>

</head>

<body>

<div class="card">

    <div class="logo">Company Logo</div>

    <div class="linha"></div>
    <div class="linha"></div>
    <div class="linha"></div>
    <div class="linha"></div>

    <div class="espaco"></div>

    <div class="avatar"></div>
    <div class="linha-pequena"></div>

</div>

</body>
</html>

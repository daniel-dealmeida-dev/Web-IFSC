<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Primo</title>
</head>
<body>
    <h1>Números Primos</h1>

    <label for="inicio">Início:</label>
    <input type="number" id="inicio">

    <label for="fim">Fim:</label>
    <input type="number" id="fim">

    <button id="btn">Verificar</button>

    <div id="resultadoPrimos"></div>

    <script>
        function ehPrimo(n) {
            if (n < 2) return false
            for (let i = 2; i < n; i++) {
                if (n % i === 0) return false
            }
            return true
        }

        function buscarPrimos(min, max) {
            let atual = min < max ? min : max
            let fim = min < max ? max : min
            let resultado = []

            while (atual <= fim) {
                if (ehPrimo(atual)) {
                    resultado.push(atual)
                }
                atual++
            }
            return resultado
        }

        let button = document.querySelector("#btn")

        button.addEventListener("click", () => {
            let inicio = Number(document.getElementById("inicio").value)
            let fim = Number(document.getElementById("fim").value)

            let primos = buscarPrimos(inicio, fim)

            document.getElementById("resultadoPrimos").innerHTML = "Primos: " + primos.join(", ")
        })
    </script>
</body>
</html>

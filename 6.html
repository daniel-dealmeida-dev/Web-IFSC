<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grid Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 40px;
            grid-template-rows: 100px 100px 100px;
            gap: 10px;
            max-width: 600px;
            padding: 15px;
            background-color: white;
            border: 1px solid #ddd;
        }

        .item1, .item2, .item3, .item4, .item5, .item6 {
            min-height: 60px;
        }

        .item1 {
            background-color: #f4a460;
            grid-column: 1;
            grid-row: 1;
        }

        .item2 {
            background-color: #f4a89a;
            grid-column: 2;
            grid-row: 1 / 3;
        }

        .item3 {
            background-color: #b2dfdb;
            grid-column: 3;
            grid-row: 1;
        }

        .item4 {
            background-color: #b0c4de;
            grid-column: 1;
            grid-row: 2;
        }

        .item5 {
            background-color: #a9c463;
            grid-column: 3;
            grid-row: 2 / 4;
        }

        .item6 {
            background-color: #f4b942;
            grid-column: 1 / 3;
            grid-row: 3;
        }

        .bolinhas {
            grid-column: 4;
            grid-row: 1 / 4;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .bolinha {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .b1 { background-color: #e0795a; }
        .b2 { background-color: #f4a89a; }
        .b3 { background-color: #a9c463; }
        .b4 { background-color: #c9a8e0; }

        /* item b: abaixo de 600px vira lista vertical */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: none;
                grid-auto-rows: 60px;
            }

            .item1, .item2, .item3, .item4, .item5, .item6 {
                grid-column: 1;
                grid-row: auto;
            }

            .bolinhas {
                grid-column: 1;
                grid-row: auto;
                flex-direction: row;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <h2>6) Usando Grid Layout</h2>

    <div class="grid-container">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>
        <div class="bolinhas">
            <div class="bolinha b1"></div>
            <div class="bolinha b2"></div>
            <div class="bolinha b3"></div>
            <div class="bolinha b4"></div>
        </div>
    </div>
</body>
</html>

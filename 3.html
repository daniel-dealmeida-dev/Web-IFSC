<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            
            background: #f4f4f4;
        }

        h2 {
            margin-bottom: 10px;
        }

        
        .bandeira {
            width: 300px;
            height: 180px;
            border: 2px solid #000;
        }

        .franca {
            display: flex;
        }

        .franca div {
            flex: 1;
        }

        .azul {
            background: rgb(0, 0, 255);
        }

        .branco {
            background: rgb(255, 255, 255);
        }

        .vermelho {
            background: rgb(255, 0, 0);
        }

        .alemanha {
            display: flex;
            flex-direction: column;
        }

        .alemanha div {
            flex: 1;
        }

        .preto {
            background: rgb(0, 0, 0);
        }

        .vermelho-alemanha {
            background: rgb(240, 7, 7);
        }

        .amarelo {
            background: rgb(247, 214, 26);
        }

        .japao {
            background: rgba(255, 255, 255, 0.966);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circulo {
            width: 100px;
            height: 100px;
            background: rgb(219, 24, 24);
            border-radius: 50%;
        }
    </style>
</head>
<body>

        <h2>França</h2>
        <div class="bandeira franca">
            <div class="azul"></div>
            <div class="branco"></div>
            <div class="vermelho"></div>
        </div>

        <h2>Alemanha</h2>
        <div class="bandeira alemanha">
            <div class="preto"></div>
            <div class="vermelho-alemanha"></div>
            <div class="amarelo"></div>
        </div>
    
        <h2>Japão</h2>
        <div class="bandeira japao">
            <div class="circulo"></div>
        </div>
    

</body>
</html>

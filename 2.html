<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #divsoma{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #controlesoma{
            display: flex;
            justify-content: flex-end;

        }
    </style>
</head>
<body>
    <h1>Soma de número na interface</h1>
    <div id="divsoma">
         <label for="entradaA">A</label>
         <input type="number" id="entradaA">

         <label for="entradaB">B</label>
         <input type="number" id="entradaB">
    
         <span>=</span>
         <span id="Resultado"></span>
         <br>
         <div id="controlesoma">
                <input id="btn" type="button" value="Somar">
         </div>
    </div>
    <script>
        let a,b;

        let inputA = document.querySelector("#entradaA")
        let inputB = document.querySelector("#entradaB")
        let button = document.getElementById("btn")
        
        button.addEventListener("click", ()=>{
            a = Number(inputA.value)
            b = Number(inputB.value)
            const soma = a+b;
            let spanResult=document.querySelector("#Resultado")
            spanResult.innerHTML=soma;
        })
        

       
    </script>
</body>
</html>

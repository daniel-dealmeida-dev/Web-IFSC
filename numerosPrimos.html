    <script>
        let numero1 = 1;
let numero2 = 20;
const resultado = new Array();

function buscarPrimos(min, max) {
    // Garante que min seja o menor
    let atual = min < max ? min : max;
    let fim = min < max ? max : min;

    while (atual <= fim) {
        let divisores = 0;
        
        for (let i = 1; i <= atual; i++) {
            if (atual % i === 0) {
                divisores++;
            }
        }

        
        if (divisores === 2) {
            resultado.push(atual);
        }
        
        atual++; 
    }
    return resultado;
}



    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eventos</title>
</head>
<body>
    <button id="alertButton">Clique aqui</button>
    <input type="text" id="textInput" placeholder="Digite algo">
    <div id="hoverDiv">Passe o mouse aqui</div>
    <select id="colorSelect">
        <option value="">Escolha uma cor</option>
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option value="red">Vermelho</option>
    </select>

    <script>
        document.getElementById("alertButton").addEventListener("click", () => {
            alert("Você clicou no botão")
        })

        let textInput = document.getElementById("textInput")

        textInput.addEventListener("keydown", (evento) => {
            console.log(evento.key)
        })

        textInput.addEventListener("focus", () => {
            textInput.style.backgroundColor = "yellow"
        })

        textInput.addEventListener("blur", () => {
            textInput.style.backgroundColor = ""
        })

        let hoverDiv = document.getElementById("hoverDiv")

        hoverDiv.addEventListener("mouseover", () => {
            hoverDiv.style.backgroundColor = "lightblue"
        })

        hoverDiv.addEventListener("mouseout", () => {
            hoverDiv.style.backgroundColor = ""
        })

        document.getElementById("colorSelect").addEventListener("change", (evento) => {
            document.body.style.backgroundColor = evento.target.value
        })
    </script>
</body>
</html>

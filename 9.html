<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cores com Espaço</title>
</head>
<body>
    <h1 id="titulo">Pressione espaço para mudar as cores</h1>
    <div id="caixa" style="width:200px; height:200px;"></div>

    <script>
        document.addEventListener("keydown", (evento) => {
            if (evento.code === "Space") {
                let r = Math.floor(Math.random() * 256)
                let g = Math.floor(Math.random() * 256)
                let b = Math.floor(Math.random() * 256)
                let cor = "rgb(" + r + "," + g + "," + b + ")"

                document.body.style.backgroundColor = cor
                document.getElementById("caixa").style.backgroundColor = cor
                document.getElementById("titulo").style.color = cor
            }
        })
    </script>
</body>
</html>
